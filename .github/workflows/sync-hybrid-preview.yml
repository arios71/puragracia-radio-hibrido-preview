name: Deploy independent hybrid preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hybrid-preview-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site artifact
        run: |
          mkdir -p /tmp/pages-site
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='README.md' ./ /tmp/pages-site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site

      - name: Deploy independent hybrid preview
        id: deployment
        uses: actions/deploy-pages@v4
